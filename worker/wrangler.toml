name = "usain-control"
main = "src/index.js"
compatibility_date = "2026-09-26"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
GITHUB_REPOSITORY = "gpennarola/gobright-auto-booking"
CONFIG_PATH = "control-settings.json"
# Set ACCESS_TEAM_DOMAIN, ACCESS_AUD and ALLOWED_EMAIL as Worker variables.
# Set GITHUB_TOKEN as an encrypted Worker secret.
