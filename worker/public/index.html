<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Usain Control</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color:#fff;background:#000}
*{box-sizing:border-box}body{margin:0;background:#000;min-height:100vh}
.app{max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 90px)}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 18px}
.brand{font-size:30px;font-weight:800;letter-spacing:-1.2px}.sub{font-size:14px;color:#8e8e93;margin-top:2px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:#1c1c1e;color:#ff9f0a;font-size:27px;line-height:38px;padding:0}
.sectionTitle{font-size:13px;color:#8e8e93;text-transform:uppercase;letter-spacing:.4px;margin:20px 4px 8px}
.card{background:#1c1c1e;border-radius:18px;overflow:hidden}
.quick{padding:14px 16px}.tomorrow{font-size:17px;font-weight:700}.tomorrowMeta{color:#8e8e93;font-size:14px;margin-top:3px}
.quickActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.action{border:0;border-radius:13px;padding:13px 10px;background:#2c2c2e;color:#fff;font-size:15px;font-weight:650}
.action.orange{color:#ff9f0a}.action.danger{color:#ff453a}.action.active{background:#3a2323;color:#ff6961}
.alarm{display:grid;grid-template-columns:1fr auto;align-items:center;padding:14px 16px;border-top:1px solid #323234}
.alarm:first-child{border-top:0}.alarmTime{font-size:34px;font-weight:300;letter-spacing:-1.4px;line-height:1.05}
.alarmMeta{color:#8e8e93;font-size:13px;margin-top:6px}.alarmLabel{font-size:14px;color:#d1d1d6;margin-top:3px}
.toggle{appearance:none;width:51px;height:31px;border-radius:20px;background:#3a3a3c;position:relative;transition:.2s}
.toggle:checked{background:#34c759}.toggle:after{content:"";position:absolute;width:27px;height:27px;top:2px;left:2px;border-radius:50%;background:#fff;transition:.2s}.toggle:checked:after{left:22px}
.empty{padding:24px 18px;color:#8e8e93;text-align:center}
.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:20}.sheet.open{display:flex}
.panel{width:min(520px,100%);background:#1c1c1e;border-radius:24px 24px 0 0;padding:12px 16px calc(env(safe-area-inset-bottom) + 18px)}
.handle{width:36px;height:5px;border-radius:5px;background:#5a5a5f;margin:0 auto 12px}
.panelHead{display:flex;justify-content:space-between;align-items:center}.panelHead h2{font-size:18px;margin:0}.textbtn{background:none;border:0;color:#ff9f0a;font-size:16px;font-weight:650;padding:8px}
.timeRow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.field{background:#2c2c2e;border-radius:14px;padding:11px 12px}.field label{display:block;color:#8e8e93;font-size:12px;margin-bottom:5px}
input[type=time]{width:100%;background:transparent;color:#fff;border:0;font-size:28px;font-weight:300;outline:0}
.days{display:flex;justify-content:space-between;gap:6px;margin:10px 0 18px}.daychip{width:38px;height:38px;border-radius:50%;border:0;background:#2c2c2e;color:#fff;font-weight:700}.daychip.on{background:#ff9f0a;color:#000}
.row{display:flex;align-items:center;justify-content:space-between;background:#2c2c2e;border-radius:14px;padding:13px 14px;margin-top:10px}
.row input[type=text]{background:transparent;border:0;color:#fff;text-align:right;font-size:16px;outline:0;width:60%}
.note{font-size:12px;color:#8e8e93;margin:10px 4px 0}.delete{width:100%;border:0;border-radius:13px;background:#2c2c2e;color:#ff453a;padding:13px;margin-top:14px;font-size:16px}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div><div class="brand">USAIN ⚡️</div><div class="sub">Programmazione</div></div>
    <button class="iconbtn" onclick="openSchedule()">+</button>
  </div>

  <div class="sectionTitle">Domani</div>
  <section class="card quick">
    <div class="tomorrow" id="tomorrowTitle">Domani</div>
    <div class="tomorrowMeta" id="tomorrowStatus">Programmazione standard</div>
    <div class="quickActions">
      <button id="skipBtn" class="action danger" onclick="toggleSkipTomorrow()">Salta domani</button>
      <button class="action orange" onclick="openTomorrow()">Cambia orario</button>
    </div>
  </section>

  <div class="sectionTitle">Programmazione settimanale</div>
  <section class="card" id="scheduleList"></section>
  <div class="note">Come nelle Sveglie: ogni riga ha un orario, i giorni in cui si ripete e un interruttore per attivarla o disattivarla.</div>
</main>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="handle"></div>
    <div class="panelHead">
      <button class="textbtn" onclick="closeSheet()">Annulla</button>
      <h2 id="sheetTitle">Nuova programmazione</h2>
      <button class="textbtn" onclick="saveSheet()">Salva</button>
    </div>
    <div class="timeRow">
      <div class="field"><label>Dalle</label><input id="start" type="time" value="15:00"></div>
      <div class="field"><label>Alle</label><input id="end" type="time" value="19:00"></div>
    </div>
    <div id="daysBlock">
      <div class="sectionTitle" style="margin-top:4px">Ripeti</div>
      <div class="days" id="daysPicker"></div>
      <div class="row"><span>Etichetta</span><input id="label" type="text" value="Sala Studenti"></div>
    </div>
    <button id="deleteBtn" class="delete" style="display:none" onclick="deleteCurrent()">Elimina programmazione</button>
  </div>
</div>

<script>
const SCHEDULE_KEY="usain-schedules-v2";
const SKIP_KEY="usain-skip-tomorrow-v1";
const TOMORROW_KEY="usain-tomorrow-override-v2";
const DAY_NAMES=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
const CHIP_NAMES=["D","L","M","M","G","V","S"];
let serverSha=null,serverReady=false,saveQueue=Promise.resolve();
let schedules=JSON.parse(localStorage.getItem(SCHEDULE_KEY)||"[]");
let skipTomorrow=JSON.parse(localStorage.getItem(SKIP_KEY)||"null");
let tomorrowOverride=JSON.parse(localStorage.getItem(TOMORROW_KEY)||"null");
let mode="new",currentId=null,selectedDays=[1,2,3,4,5];

if(!schedules.length){
  schedules=[{id:Date.now(),start:"15:00",end:"19:00",days:[1,2,3,4,5],enabled:true,label:"Sala Studenti"}];
  saveSchedules();
}

function localISO(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
function tomorrowDate(){const d=new Date();d.setDate(d.getDate()+1);return d}
function tomorrowISO(){return localISO(tomorrowDate())}
function saveSchedules(){localStorage.setItem(SCHEDULE_KEY,JSON.stringify(schedules));syncSettings()}
function syncSettings(){
  if(!serverReady)return;
  const settings=JSON.parse(JSON.stringify({schedules,skipTomorrow,tomorrowOverride}));
  saveQueue=saveQueue.then(async()=>{
    const response=await fetch("/api/settings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({settings,sha:serverSha})});
    if(!response.ok)throw new Error(await response.text());
    serverSha=(await response.json()).sha;
  }).catch(error=>{serverReady=false;document.body.style.pointerEvents="none";alert("Modifica non salvata: "+error.message+". Riapri l'app per aggiornare i dati.")});
}
async function loadSettings(){
  document.body.style.pointerEvents="none";
  try{
    const response=await fetch("/api/settings",{cache:"no-store"});
    if(!response.ok)throw new Error("Impossibile leggere la programmazione");
    const data=await response.json();serverSha=data.sha;
    schedules=data.settings.schedules;skipTomorrow=data.settings.skipTomorrow;tomorrowOverride=data.settings.tomorrowOverride;
    serverReady=true;document.body.style.pointerEvents="auto";render();
  }catch(error){alert(error.message+". Riapri l'app quando la connessione è disponibile.")}
}
function daysText(days){
  if(days.length===7)return "Ogni giorno";
  if(JSON.stringify(days)==JSON.stringify([1,2,3,4,5]))return "Lun–Ven";
  return days.map(d=>DAY_NAMES[d]).join(", ");
}
function effectiveTomorrow(){
  const t=tomorrowDate(),iso=tomorrowISO(),dow=t.getDay();
  if(skipTomorrow===iso)return {skip:true};
  if(tomorrowOverride && tomorrowOverride.date===iso)return {start:tomorrowOverride.start,end:tomorrowOverride.end,override:true};
  const s=schedules.find(x=>x.enabled&&x.days.includes(dow));
  return s?{start:s.start,end:s.end,label:s.label}:{none:true};
}
function normalize(){
  const iso=tomorrowISO();
  if(skipTomorrow&&skipTomorrow!==iso){skipTomorrow=null;localStorage.removeItem(SKIP_KEY)}
  if(tomorrowOverride&&tomorrowOverride.date!==iso){tomorrowOverride=null;localStorage.removeItem(TOMORROW_KEY)}
}
function render(){
  normalize();
  const list=document.getElementById("scheduleList");
  list.innerHTML=schedules.length?"":"<div class='empty'>Nessuna programmazione. Tocca + per aggiungerne una.</div>";
  schedules.forEach(s=>{
    list.insertAdjacentHTML("beforeend",`<div class="alarm" onclick="editSchedule(${s.id})"><div><div class="alarmTime">${s.start}–${s.end}</div><div class="alarmMeta">${daysText(s.days)}</div><div class="alarmLabel">${s.label||"Usain"}</div></div><input class="toggle" type="checkbox" ${s.enabled?"checked":""} onclick="event.stopPropagation()" onchange="toggleSchedule(${s.id},this.checked)"></div>`);
  });
  const t=tomorrowDate(),eff=effectiveTomorrow();
  document.getElementById("tomorrowTitle").textContent=`Domani · ${DAY_NAMES[t.getDay()]} ${t.getDate()}/${t.getMonth()+1}`;
  const status=document.getElementById("tomorrowStatus"),btn=document.getElementById("skipBtn");
  if(eff.skip){status.textContent="Nessun flusso di prenotazione";btn.textContent="Domani saltato ✓";btn.classList.add("active")}
  else if(eff.none){status.textContent="Nessuna programmazione attiva";btn.textContent="Salta domani";btn.classList.remove("active")}
  else{status.textContent=`${eff.start}–${eff.end}${eff.override?" · modifica solo per domani":""}`;btn.textContent="Salta domani";btn.classList.remove("active")}
}
function toggleSkipTomorrow(){
  const iso=tomorrowISO();
  skipTomorrow=skipTomorrow===iso?null:iso;
  if(skipTomorrow)localStorage.setItem(SKIP_KEY,JSON.stringify(skipTomorrow)); else localStorage.removeItem(SKIP_KEY);
  syncSettings();
  render();
}
function toggleSchedule(id,v){const s=schedules.find(x=>x.id===id);if(s){s.enabled=v;saveSchedules();render()}}
function buildDays(){
  const box=document.getElementById("daysPicker");box.innerHTML="";
  CHIP_NAMES.forEach((n,d)=>box.insertAdjacentHTML("beforeend",`<button class="daychip ${selectedDays.includes(d)?"on":""}" onclick="toggleDay(${d})">${n}</button>`));
}
function toggleDay(d){selectedDays=selectedDays.includes(d)?selectedDays.filter(x=>x!==d):[...selectedDays,d].sort();buildDays()}
function openSchedule(){
  mode="new";currentId=null;selectedDays=[1,2,3,4,5];
  document.getElementById("sheetTitle").textContent="Nuova programmazione";
  document.getElementById("start").value="15:00";document.getElementById("end").value="19:00";document.getElementById("label").value="Sala Studenti";
  document.getElementById("daysBlock").style.display="block";document.getElementById("deleteBtn").style.display="none";buildDays();openSheet();
}
function editSchedule(id){
  const s=schedules.find(x=>x.id===id);if(!s)return;
  mode="edit";currentId=id;selectedDays=[...s.days];
  document.getElementById("sheetTitle").textContent="Modifica programmazione";
  document.getElementById("start").value=s.start;document.getElementById("end").value=s.end;document.getElementById("label").value=s.label||"Sala Studenti";
  document.getElementById("daysBlock").style.display="block";document.getElementById("deleteBtn").style.display="block";buildDays();openSheet();
}
function openTomorrow(){
  mode="tomorrow";currentId=null;
  const eff=effectiveTomorrow();
  document.getElementById("sheetTitle").textContent="Orario di domani";
  document.getElementById("start").value=eff.start||"15:00";document.getElementById("end").value=eff.end||"19:00";
  document.getElementById("daysBlock").style.display="none";document.getElementById("deleteBtn").style.display=tomorrowOverride&&tomorrowOverride.date===tomorrowISO()?"block":"none";openSheet();
}
function openSheet(){document.getElementById("sheet").classList.add("open")}
function closeSheet(){document.getElementById("sheet").classList.remove("open")}
function saveSheet(){
  const start=document.getElementById("start").value,end=document.getElementById("end").value;
  if(!start||!end)return;
  if(mode==="tomorrow"){
    tomorrowOverride={date:tomorrowISO(),start,end};localStorage.setItem(TOMORROW_KEY,JSON.stringify(tomorrowOverride));skipTomorrow=null;localStorage.removeItem(SKIP_KEY);syncSettings();
  }else if(mode==="new"){
    schedules.push({id:Date.now(),start,end,days:selectedDays,enabled:true,label:document.getElementById("label").value||"Usain"});
    saveSchedules();
  }else{
    const s=schedules.find(x=>x.id===currentId);if(s){s.start=start;s.end=end;s.days=selectedDays;s.label=document.getElementById("label").value||"Usain";saveSchedules()}
  }
  closeSheet();render();
}
function deleteCurrent(){
  if(mode==="tomorrow"){tomorrowOverride=null;localStorage.removeItem(TOMORROW_KEY);syncSettings()}
  else{schedules=schedules.filter(x=>x.id!==currentId);saveSchedules()}
  closeSheet();render();
}
render();
loadSettings();
</script>
</body></html>
