<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
<title>Usain Control</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color:#f5f5f7;background:#080809}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#151518,#080809 35%);min-height:100vh}
.app{max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 18px 110px}
.hero{display:flex;justify-content:space-between;align-items:center;margin:10px 0 24px}.brand{font-size:30px;font-weight:800;letter-spacing:-1px}.bolt{font-size:28px}
.card{background:#171719;border:1px solid #29292d;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 12px 35px #0005}
.muted{color:#9b9ba1}.status{display:inline-flex;gap:7px;align-items:center;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#34c759}
h2{font-size:18px;margin:0 0 12px}.day{display:grid;grid-template-columns:1fr auto;gap:8px;padding:14px 0;border-top:1px solid #2a2a2d}.day:first-of-type{border-top:0}
.day strong{display:block}.time{font-size:14px;color:#b8b8be;margin-top:3px}.toggle{appearance:none;width:48px;height:29px;border-radius:20px;background:#3a3a3e;position:relative;transition:.2s}
.toggle:checked{background:#34c759}.toggle:after{content:"";position:absolute;width:25px;height:25px;top:2px;left:2px;border-radius:50%;background:white;transition:.2s}.toggle:checked:after{left:21px}
button{border:0;border-radius:15px;padding:14px 16px;font-size:16px;font-weight:700}.primary{width:100%;background:#f5f5f7;color:#0b0b0c}.secondary{background:#2b2b2f;color:white}
.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center}.sheet.open{display:flex}.panel{width:min(520px,100%);background:#1c1c1e;border-radius:26px 26px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px)}
label{font-size:13px;color:#aaa;display:block;margin:14px 0 6px}input,select{width:100%;background:#2b2b2e;color:white;border:1px solid #3b3b40;border-radius:12px;padding:13px;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1}
.pill{font-size:12px;background:#242428;border-radius:999px;padding:6px 9px;color:#bdbdc2}
</style></head><body><main class="app">
<div class="hero"><div><div class="brand">USAIN ⚡️</div><div class="muted">Control</div></div><span class="status"><span class="dot"></span> Sistema pronto</span></div>
<section class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><h2>Prossima corsa</h2><div id="next" class="muted">Nessuna prenotazione programmata</div></div><div style="display:flex;flex-direction:column;gap:8px;min-width:150px"><button id="skipBtn" class="secondary" onclick="toggleSkipTomorrow()">Salta domani</button><button class="secondary" onclick="openTomorrowTime()">Cambia orario domani</button></div></div><div id="skipNote" class="time" style="margin-top:10px"></div></section>
<section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Programmazione</h2><span class="pill">iPhone</span></div><div id="days"></div><button class="primary" onclick="openSheet()">＋ Nuova prenotazione</button></section>
<section class="card"><h2>Preferenze</h2><div class="day"><div><strong>Priorità postazioni</strong><div class="time">Sala Stud 1 → 5, poi Desk Stud</div></div><button class="secondary" onclick="alert('La gestione avanzata delle preferenze sarà collegata nella fase 2.')">Gestisci</button></div></section>
</main>
<div class="sheet" id="sheet"><div class="panel"><h2 id="sheetTitle">Nuova prenotazione</h2>
<label>Data</label><input id="date" type="date">
<div class="row"><div><label>Dalle</label><input id="start" type="time" value="15:00"></div><div><label>Alle</label><input id="end" type="time" value="19:00"></div></div>
<label>Preferenza</label><select id="pref"><option>Sala Stud (priorità)</option><option>Qualsiasi postazione</option></select>
<div class="actions"><button class="secondary" onclick="closeSheet()">Annulla</button><button id="saveBtn" class="primary" onclick="save()">Programma</button></div></div></div>
<script>
const KEY="usain-control-v1"; const SKIP_KEY="usain-skip-tomorrow-v1"; const TOMORROW_TIME_KEY="usain-tomorrow-time-v1"; let items=JSON.parse(localStorage.getItem(KEY)||"[]"); let skipTomorrow=JSON.parse(localStorage.getItem(SKIP_KEY)||"null"); let tomorrowTime=JSON.parse(localStorage.getItem(TOMORROW_TIME_KEY)||"null"); let editMode="new";
function fmt(d){return new Intl.DateTimeFormat("it-IT",{weekday:"long",day:"numeric",month:"long"}).format(new Date(d+"T12:00"))}
function tomorrowISO(){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}
function normalizeSkip(){if(skipTomorrow && skipTomorrow!==tomorrowISO()){skipTomorrow=null;localStorage.removeItem(SKIP_KEY)}}
function toggleSkipTomorrow(){normalizeSkip();const t=tomorrowISO();skipTomorrow=skipTomorrow===t?null:t;if(skipTomorrow)localStorage.setItem(SKIP_KEY,JSON.stringify(skipTomorrow));else localStorage.removeItem(SKIP_KEY);render()}
function render(){normalizeSkip();items.sort((a,b)=>a.date.localeCompare(b.date)); const box=document.getElementById("days");box.innerHTML=items.length?"":"<p class='muted'>Aggiungi i giorni in cui vuoi attivare Usain.</p>";
items.forEach((x,i)=>box.insertAdjacentHTML("beforeend",`<div class="day"><div onclick="edit(${i})"><strong>${fmt(x.date)}</strong><div class="time">${x.start}–${x.end} · ${x.pref}</div></div><input class="toggle" type="checkbox" ${x.enabled?"checked":""} onchange="toggle(${i},this.checked)"></div>`));
const t=tomorrowISO();if(tomorrowTime&&tomorrowTime.date!==t){tomorrowTime=null;localStorage.removeItem(TOMORROW_TIME_KEY)}const n=items.find(x=>x.enabled&&x.date>=new Date().toISOString().slice(0,10)&&!(skipTomorrow===t&&x.date===t));document.getElementById("next").innerHTML=n?`<strong>${fmt(n.date)}</strong><div class="time">${n.start}–${n.end} · Attiva</div>`:"Nessuna prenotazione programmata";
const btn=document.getElementById("skipBtn"),note=document.getElementById("skipNote");if(skipTomorrow===t){btn.textContent="Domani saltato ✓";btn.style.background="#3a2a2a";note.textContent="Usain non dovrà avviare il flusso per domani. Tocca di nuovo per riattivarlo."}else{btn.textContent="Salta domani";btn.style.background="";note.textContent=""}}
function openSheet(){editMode="new";document.getElementById("sheetTitle").textContent="Nuova prenotazione";document.getElementById("saveBtn").textContent="Programma";document.getElementById("date").disabled=false;document.getElementById("sheet").classList.add("open");document.getElementById("date").value=tomorrowISO()}
function openTomorrowTime(){editMode="tomorrow";document.getElementById("sheetTitle").textContent="Orario di domani";document.getElementById("saveBtn").textContent="Salva orario";document.getElementById("date").value=tomorrowISO();document.getElementById("date").disabled=true;if(tomorrowTime&&tomorrowTime.date===tomorrowISO()){document.getElementById("start").value=tomorrowTime.start;document.getElementById("end").value=tomorrowTime.end}else{const x=items.find(i=>i.date===tomorrowISO()&&i.enabled);document.getElementById("start").value=x?x.start:"15:00";document.getElementById("end").value=x?x.end:"19:00"}document.getElementById("sheet").classList.add("open")}
function closeSheet(){document.getElementById("sheet").classList.remove("open")}
function save(){const date=document.getElementById("date").value;if(!date)return alert("Scegli una data");const start=document.getElementById("start").value,end=document.getElementById("end").value,pref=document.getElementById("pref").value;if(editMode==="tomorrow"){tomorrowTime={date,start,end};localStorage.setItem(TOMORROW_TIME_KEY,JSON.stringify(tomorrowTime));const idx=items.findIndex(i=>i.date===date);if(idx>=0){items[idx].start=start;items[idx].end=end}else{items.push({date,start,end,pref,enabled:true})}}else{items.push({date,start,end,pref,enabled:true})}persist();closeSheet()}
function toggle(i,v){items[i].enabled=v;persist()} function edit(i){if(confirm("Eliminare questa programmazione?")){items.splice(i,1);persist()}}
function persist(){localStorage.setItem(KEY,JSON.stringify(items));render()} render(); if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
